[package]
name = "blip"
version = "0.1.0"
edition = "2024"
description = "A cursor-anchored, draggable, topmost notification panel for Windows"

[lib]
name = "blip"
path = "src/lib.rs"

# CLI client — console subsystem so it works in a pipeline
[[bin]]
name = "blip"
path = "src/bin/blip.rs"

# Resident daemon — windows subsystem, no console ever
[[bin]]
name = "blipd"
path = "src/bin/blipd.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
windows-numerics = "0.3.1"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Media_Audio",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
